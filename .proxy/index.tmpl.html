<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subscription</title>
<style>
  body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0d1117;color:#c9d1d9;
       margin:0;padding:2rem;max-width:60rem;margin-inline:auto;line-height:1.7}
  h1{font-size:1.2rem;color:#58a6ff}
  a{color:#58a6ff;word-break:break-all}
  .box{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:1rem;margin:1rem 0}
  .lbl{color:#8b949e;font-size:.85rem}
  code{background:#21262d;padding:.15rem .4rem;border-radius:4px;color:#79c0ff}
  pre{white-space:pre-wrap;word-break:break-all;background:#21262d;padding:.8rem;border-radius:6px;
      border:1px solid #30363d;font-size:.8rem}
</style>
</head>
<body>
<h1>لینک اشتراک</h1>

<div class="box">
  <div class="lbl">Subscription URL (text/plain)</div>
  <a href="sub.txt">sub.txt</a>
  <pre>{{BASE_URL}}/sub.txt</pre>
</div>

<div class="box">
  <div class="lbl">Tunnel endpoint</div>
  <a href="{{TUNNEL}}">{{TUNNEL}}</a>
</div>

<div class="box">
  <div class="lbl">کانفیگ‌ها</div>
  <pre>{{DIRECT_URI}}
{{TUNNEL_URI}}</pre>
</div>

<div class="box">
  <div class="lbl">نکته</div>
  این لینک هر بار که workflow اجرا بشه عوض می‌شه. تاریخ آخرین بروزرسانی:
  <code>{{GENERATED_AT}}</code>
</div>
</body>
</html>
