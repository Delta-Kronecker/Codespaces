name: public-proxy

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: "Keep the tunnel alive for N hours (max 6)"
        required: false
        default: "5"
      tunnel:
        description: "Tunnel provider: bore (no data cap) or ngrok (1GB/month)"
        required: false
        default: "bore"
  schedule:
    - cron: "17 */5 * * *"

permissions:
  contents: write

concurrency:
  group: public-proxy
  cancel-in-progress: false

env:
  TUNNEL_PROVIDER: ${{ github.event.inputs.tunnel || 'bore' }}
  TUNNEL_UUID: ca52e2b6-fb9f-4dac-b6dc-49da9923f251
  BORE_LOCAL_PORT: "20000"
  BORE_REMOTE_PORT: "20123"
  NGROK_LOCAL_PORT: "10000"

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Xray-core
        run: |
          set -euo pipefail
          mkdir -p "$HOME/xray/log"
          curl -fsSL -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          python3 -c "import zipfile,os; zipfile.ZipFile('/tmp/xray.zip').extractall(os.path.expanduser('~/xray'))"
          chmod +x "$HOME/xray/xray"
          "$HOME/xray/xray" version | head -1
          echo "provider: $TUNNEL_PROVIDER"

      - name: Load or create REALITY keys
        if: env.TUNNEL_PROVIDER == 'bore'
        run: |
          set -euo pipefail
          F=.proxy/reality.json
          if [ -f "$F" ]; then
            echo "reusing existing REALITY keys"
            read -r PRIV PUB SID SNI < <(python3 -c "
          import json
          d = json.load(open('.proxy/reality.json'))
          print(d['private'], d['public'], d['sid'], d.get('sni', 'addons.mozilla.org'))
          ")
          else
            OUT=$("$HOME/xray/xray" x25519)
            PRIV=$(printf '%s\n' "$OUT" | sed -n 's/.*[Pp]rivate[^:]*: *//p' | head -1)
            PUB=$(printf '%s\n' "$OUT" | sed -n 's/.*[Pp]ublic[^:]*: *//p' | head -1)
            SID=$(openssl rand -hex 8)
            SNI=addons.mozilla.org
            python3 -c "
          import json, sys
          json.dump({'private': sys.argv[1], 'public': sys.argv[2], 'sid': sys.argv[3], 'sni': sys.argv[4]},
                    open('.proxy/reality.json', 'w'), indent=2)
          " "$PRIV" "$PUB" "$SID" "$SNI"
            git add .proxy/reality.json
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Persist REALITY keys"
            git push -q origin HEAD:main
            echo "generated and persisted new REALITY keys"
          fi
          if [ -z "$PRIV" ] || [ -z "$PUB" ] || [ -z "$SID" ]; then
            echo "::error::could not load REALITY keys"
            exit 1
          fi
          echo "::add-mask::$PRIV"
          echo "REALITY sid=$SID sni=$SNI"
          echo "PRIV=$PRIV"   >> "$GITHUB_ENV"
          echo "PUB=$PUB"     >> "$GITHUB_ENV"
          echo "SID=$SID"     >> "$GITHUB_ENV"
          echo "SNI=$SNI"     >> "$GITHUB_ENV"

      - name: Test every upstream through a proxy
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 .proxy/check.py .proxy/endpoints.txt \
            --out dist/upstreams.txt \
            --report dist/report.txt
          echo "--- alive upstreams ---"
          cat dist/upstreams.txt
          if [ ! -s dist/upstreams.txt ]; then
            echo "::error::no upstream is alive"
            exit 1
          fi

      - name: Chain runner to the first alive upstream
        run: |
          set -euo pipefail
          CHAIN="$(head -n1 dist/upstreams.txt)"
          echo "Chaining to: $CHAIN"
          if [ "$TUNNEL_PROVIDER" = "bore" ]; then
            python3 .proxy/check.py --emit-server "$CHAIN" \
              --emit-out "$HOME/xray/server.json" \
              --emit-listen 127.0.0.1 --emit-port "$BORE_LOCAL_PORT" \
              --emit-mode reality \
              --emit-private "$PRIV" --emit-sid "$SID" --emit-sni "$SNI"
          else
            python3 .proxy/check.py --emit-server "$CHAIN" \
              --emit-out "$HOME/xray/server.json" \
              --emit-listen 0.0.0.0 --emit-port "$NGROK_LOCAL_PORT" \
              --emit-mode ws
          fi
          python3 -m json.tool "$HOME/xray/server.json" > /dev/null

      - name: Start Xray server
        run: |
          set -euo pipefail
          PORT="$([ "$TUNNEL_PROVIDER" = "bore" ] && echo "$BORE_LOCAL_PORT" || echo "$NGROK_LOCAL_PORT")"
          nohup "$HOME/xray/xray" run -c "$HOME/xray/server.json" \
            >>"$HOME/xray/log/xray.log" 2>&1 &
          for _ in $(seq 1 20); do
            ss -ltn | grep -q ":${PORT} " && break
            sleep 1
          done
          if ! ss -ltn | grep -q ":${PORT} "; then
            echo "::error::xray server did not start"
            tail -40 "$HOME/xray/log/xray.log"
            exit 1
          fi

      - name: Diagnose chain without the tunnel
        id: chain
        run: |
          set -euo pipefail
          if [ "$TUNNEL_PROVIDER" = "bore" ]; then
            U="vless://${TUNNEL_UUID}@127.0.0.1:${BORE_LOCAL_PORT}?encryption=none&flow=xtls-rprx-vision&security=reality&sni=${SNI}&fp=chrome&pbk=${PUB}&sid=${SID}&type=tcp&headerType=none#local-chain"
          else
            U="vless://${TUNNEL_UUID}@127.0.0.1:${NGROK_LOCAL_PORT}?encryption=none&security=none&type=ws&path=%2F#local-chain"
          fi
          python3 .proxy/check.py --extra "$U" --out /tmp/chain.txt --report /tmp/chain.report || true
          cat /tmp/chain.report
          if [ -s /tmp/chain.txt ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "chain is OK -> suspect the tunnel"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::chain itself is broken (client -> xray -> upstream)"
            echo "--- xray server log ---"
            tail -80 "$HOME/xray/log/xray.log" || true
          fi

      - name: Start bore tunnel
        id: bore
        if: env.TUNNEL_PROVIDER == 'bore'
        run: |
          set -euo pipefail
          LATEST=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/ekzhang/bore/releases/latest)
          URL=$(printf '%s' "$LATEST" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for a in d['assets']:
              n = a['name']
              if n.endswith('.tar.gz') and 'x86_64-unknown-linux' in n:
                  print(a['browser_download_url']); break
          ")
          if [ -z "$URL" ]; then
            echo "::error::no bore linux asset found"
            printf '%s' "$LATEST" | head -40
            exit 1
          fi
          echo "downloading $URL"
          curl -fsSL -o /tmp/bore.tgz "$URL"
          tar xzf /tmp/bore.tgz -C /tmp
          sudo install -m755 /tmp/bore /usr/local/bin/bore
          bore --version || true

          LOG="$HOME/xray/log/bore.log"
          : > "$LOG"
          STARTED=""
          for P in 443 "$BORE_REMOTE_PORT"; do
            echo "trying remote port $P"
            nohup bore local "$BORE_LOCAL_PORT" --to bore.pub --port "$P" >>"$LOG" 2>&1 &
            sleep 5
            if grep -q "bore\.pub:${P}\b" "$LOG"; then
              STARTED=$P
              break
            fi
            echo "port $P unavailable"
            pkill -f 'bore loca[l]' || true
            sleep 1
          done
          if [ -z "$STARTED" ]; then
            echo "fixed ports unavailable, falling back to a random one"
            nohup bore local "$BORE_LOCAL_PORT" --to bore.pub >>"$LOG" 2>&1 &
          fi

          ENDPOINT=""
          for _ in $(seq 1 40); do
            ENDPOINT=$(grep -Eo 'bore\.pub:[0-9]+' "$LOG" | head -1 || true)
            if [ -n "$ENDPOINT" ]; then break; fi
            sleep 2
          done
          if [ -z "$ENDPOINT" ]; then
            echo "::error::bore did not report a public endpoint"
            tail -60 "$LOG" || true
            exit 1
          fi
          echo "url=$ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "Tunnel: $ENDPOINT"

      - name: Start ngrok tunnel
        id: ngrok
        if: env.TUNNEL_PROVIDER != 'bore'
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          set -euo pipefail

          install_ngrok() {
            for url in \
              "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz" \
              "https://ngrok-agent.s3.amazonaws.com/ngrok-v3-stable-linux-amd64.tgz" \
              "https://ngrok-agent.s3.amazonaws.com/ngrok-stable-linux-amd64.tgz"
            do
              echo "trying $url"
              if curl -fsSL --connect-timeout 20 -o /tmp/ngrok.tgz "$url"; then
                tar xzf /tmp/ngrok.tgz -C /tmp
                if [ -f /tmp/ngrok ]; then
                  sudo install -m755 /tmp/ngrok /usr/local/bin/ngrok
                  echo "installed from $url"
                  return 0
                fi
              fi
            done
            echo "--- apt fallback ---"
            curl -fsSL --connect-timeout 20 -o /tmp/ngrok.asc \
              https://ngrok-agent.s3.amazonaws.com/ngrok.asc
            sudo mkdir -p /etc/apt/keyrings
            sudo cp /tmp/ngrok.asc /etc/apt/keyrings/ngrok.asc
            echo "deb [signed-by=/etc/apt/keyrings/ngrok.asc] https://apt.ngrok.com/ngrok stable main" \
              | sudo tee /etc/apt/sources.list.d/ngrok.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq ngrok
          }

          install_ngrok
          command -v ngrok
          ngrok version
          ngrok config add-authtoken "$NGROK_AUTHTOKEN" >/dev/null

          nohup ngrok http 127.0.0.1:"$NGROK_LOCAL_PORT" \
            >>"$HOME/xray/log/ngrok.log" 2>&1 &

          URL=""
          for _ in $(seq 1 60); do
            URL=$(curl -fsS http://127.0.0.1:4040/api/tunnels 2>/dev/null \
                  | python3 -c "import sys,json;print(json.load(sys.stdin)['tunnels'][0]['public_url'])" 2>/dev/null || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "::error::ngrok did not return a URL"
            tail -60 "$HOME/xray/log/ngrok.log" || true
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Tunnel: $URL"

      - name: Verify end to end through the tunnel
        id: verify
        env:
          TUNNEL: ${{ env.TUNNEL_PROVIDER == 'bore' && steps.bore.outputs.url || steps.ngrok.outputs.url }}
        run: |
          set -euo pipefail
          if [ "$TUNNEL_PROVIDER" = "bore" ]; then
            HOST="${TUNNEL%%:*}"
            PORT="${TUNNEL##*:}"
            TUNNEL_URI="vless://${TUNNEL_UUID}@${HOST}:${PORT}?encryption=none&flow=xtls-rprx-vision&security=reality&sni=${SNI}&fp=chrome&pbk=${PUB}&sid=${SID}&type=tcp&headerType=none#Proxy"
          else
            HOST="${TUNNEL#https://}"
            TUNNEL_URI="vless://${TUNNEL_UUID}@${HOST}:443?encryption=none&security=tls&sni=${HOST}&fp=chrome&type=ws&host=${HOST}&path=%2F#Proxy"
          fi
          echo "URI: $TUNNEL_URI"

          OK=false
          for i in $(seq 1 8); do
            echo "--- attempt ${i}/8 ---"
            python3 .proxy/check.py --extra "$TUNNEL_URI" \
              --out /tmp/verify.txt --report /tmp/verify.report || true
            cat /tmp/verify.report
            if [ -s /tmp/verify.txt ]; then OK=true; break; fi
            sleep 10
          done

          cp /tmp/verify.report dist/verify.txt
          printf '%s\n' "$TUNNEL_URI" > dist/sub.txt
          if [ "$OK" = true ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::tunnel is NOT reachable end to end after 8 attempts"
            echo "--- tunnel log ---"
            tail -80 "$HOME/xray/log/bore.log" 2>/dev/null || true
            tail -80 "$HOME/xray/log/ngrok.log" 2>/dev/null || true
            echo "--- xray server log ---"
            tail -80 "$HOME/xray/log/xray.log" || true
          fi

      - name: Build site
        env:
          TUNNEL: ${{ env.TUNNEL_PROVIDER == 'bore' && steps.bore.outputs.url || steps.ngrok.outputs.url }}
        run: |
          set -euo pipefail
          export TUNNEL \
                 BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" \
                 GENERATED_AT="$(date -u +%FT%TZ)"
          python3 - <<'PY'
          import os, pathlib, re
          tpl = pathlib.Path(".proxy/index.tmpl.html").read_text(encoding="utf-8")
          rep = pathlib.Path("dist/report.txt").read_text(encoding="utf-8").strip()
          ver = pathlib.Path("dist/verify.txt").read_text(encoding="utf-8").strip()
          total = int(re.search(r"total:\s*(\d+)", rep).group(1))
          healthy = int(re.search(r"healthy:\s*(\d+)", rep).group(1))
          for k, v in {
              "TUNNEL": os.environ.get("TUNNEL", ""),
              "BASE_URL": os.environ.get("BASE_URL", ""),
              "GENERATED_AT": os.environ.get("GENERATED_AT", ""),
              "SUB_CONTENT": pathlib.Path("dist/sub.txt").read_text(encoding="utf-8").strip(),
              "VERIFY": ver,
              "REPORT": rep,
              "TOTAL": str(total),
              "HEALTHY": str(healthy),
          }.items():
              tpl = tpl.replace("{{%s}}" % k, v)
          pathlib.Path("dist/index.html").write_text(tpl, encoding="utf-8")
          PY
          ls -la dist

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git checkout -q -B gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "site $(date -u +%FT%TZ)"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Fail if tunnel is not verified
        if: steps.verify.outputs.ok != 'true'
        run: |
          echo "::error::tunnel failed end-to-end verification - see report.txt / verify.txt on Pages"
          exit 1

      - name: Keep tunnel alive
        env:
          DURATION_HOURS: ${{ github.event.inputs.duration_hours }}
        run: |
          set -euo pipefail
          H="${DURATION_HOURS:-5}"
          case "$H" in ''|*[!0-9]*) H=5 ;; esac
          if [ "$H" -gt 6 ]; then H=6; fi
          echo "Keeping tunnel up for ${H}h ..."
          sleep $(( H * 3600 ))
